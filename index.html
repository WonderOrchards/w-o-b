<!doctype html>

<html lang="en" class="dark">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Three.js Particle Field + Dynamic Navigation</title>

  <style>

    :root{

      --bg: #071026;

      --content-bg: linear-gradient(180deg, rgba(15,18,24,0.6), rgba(10,12,16,0.4));

      --text-color: #e6eef8;

      --panel-bg: #0f1724;

      --cog-bg: rgba(14,18,24,0.95);

      --link-color: #93d6ff;

      --link-hover-color: #c2e4ff;

      --h1-color: #ffffff;

      --h2-color: #e6eef8;

      --h3-color: #d0d8e2;

      --code-bg: rgba(0,0,0,0.2);

      --code-color: #ff9d9d;

      --blockquote-border: rgba(93, 173, 255, 0.5);

      --blockquote-bg: rgba(93, 173, 255, 0.08);

    } 

    .light{

      --bg: rgba(255,255,255,0.0);

      --content-bg: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));

      --text-color: #111;

      --panel-bg: #ffffff;

      --cog-bg: rgba(255,255,255,0.9);

      --link-color: #0066cc;

      --link-hover-color: #004499;

      --h1-color: #000000;

      --h2-color: #111111;

      --h3-color: #222222;

      --code-bg: rgba(0,0,0,0.06);

      --code-color: #d73038;

      --blockquote-border: rgba(0, 102, 204, 0.4);

      --blockquote-bg: rgba(0, 102, 204, 0.06);

    } 

    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);color:var(--text-color)}

    #bg {position:fixed;inset:0;z-index:0;pointer-events:none;display:block}

    

    /* Navigation styles */

    .nav-container {

      position: fixed;

      left: 20px;

      top: 20px;

      z-index: 2;

      background: var(--panel-bg);

      border-radius: 12px;

      padding: 14px;

      box-shadow: 0 14px 40px rgba(0,0,0,0.12);

      max-height: calc(100vh - 40px);

      overflow-y: auto;

      width: 240px;

    }

    

    .nav-header {

      font-weight: bold;

      margin-bottom: 12px;

      color: var(--h2-color);

    }

    

    .nav-list {

      list-style: none;

      padding: 0;

      margin: 0;

    }

    

    .nav-list li {

      margin-bottom: 6px;

    }

    

    .nav-list a {

      color: var(--link-color);

      text-decoration: none;

      display: block;

      padding: 6px 8px;

      border-radius: 6px;

      transition: background 0.2s ease;

    }

    

    .nav-list a:hover {

      color: var(--link-hover-color);

      background: rgba(255,255,255,0.05);

    }

    

    .nav-list a.active {

      background: rgba(93, 173, 255, 0.15);

      color: var(--link-hover-color);

    }

    

    /* Content area */

    .content{

      position:relative;

      z-index:1;

      max-width:900px;

      margin: 40px auto 40px 300px;

      padding:30px;

      background:var(--content-bg);

      border-radius:12px;

      box-shadow:0 10px 30px rgba(0,0,0,0.08);

      backdrop-filter: blur(6px);

      min-height: 400px;

    }

    

    /* Markdown content styles */

    #file-content h1{font-size:clamp(26px,4vw,40px);margin:0 0 12px;color:var(--h1-color)}

    #file-content h2{color:var(--h2-color); margin-top: 1.8em; margin-bottom: 0.8em;}

    #file-content h3{color:var(--h3-color); margin-top: 1.5em; margin-bottom: 0.7em;}

    #file-content p{line-height:1.6;color:var(--text-color); margin-bottom: 1em;}

    #file-content a{color:var(--link-color);text-decoration:none;transition:color 0.2s ease}

    #file-content a:hover{color:var(--link-hover-color)}

    #file-content ul, #file-content ol {margin-bottom: 1em; padding-left: 1.8em;}

    #file-content li {margin-bottom: 0.4em; line-height: 1.5;}

    #file-content code {background: var(--code-bg); color: var(--code-color); padding: 0.2em 0.4em; border-radius: 4px; font-size: 0.9em;}

    #file-content pre {background: var(--code-bg); padding: 1em; border-radius: 8px; overflow: auto; margin-bottom: 1.5em;}

    #file-content pre code {background: none; padding: 0; color: inherit;}

    #file-content blockquote {border-left: 4px solid var(--blockquote-border); background: var(--blockquote-bg); padding: 1em 1.5em; margin: 1.5em 0; border-radius: 0 8px 8px 0;}

    #file-content table {width: 100%; border-collapse: collapse; margin-bottom: 1.5em;}

    #file-content th, #file-content td {padding: 0.5em 1em; text-align: left; border: 1px solid rgba(255,255,255,0.1);}

    #file-content th {background: rgba(255,255,255,0.05);}

    

    /* Loading state */

    #loading {

      text-align: center;

      padding: 2em;

      color: var(--text-color);

      opacity: 0.7;

    }

    

    /* Responsive adjustments */

    @media (max-width: 1024px) {

      .nav-container {

        width: 200px;

      }

      

      .content {

        margin-left: 260px;

        max-width: calc(100% - 280px);

      }

    }

    

    @media (max-width: 768px) {

      .nav-container {

        position: relative;

        width: auto;

        left: auto;

        top: auto;

        margin: 20px 20px 0;

        max-height: none;

      }

      

      .content {

        margin: 20px;

        max-width: calc(100% - 40px);

      }

    }



    .floating-shape{width:120px;height:120px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin:10px;background:rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.04);color:var(--text-color)}

    .cog {position:fixed;right:16px;bottom:16px;z-index:3;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--cog-bg);box-shadow:0 6px 18px rgba(0,0,0,0.12);cursor:pointer;border:1px solid rgba(0,0,0,0.06)}

    .cog svg{width:18px;height:18px}

    .panel{position:fixed;right:16px;bottom:64px;z-index:4;width:360px;background:var(--panel-bg);border-radius:12px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,0.12);display:none;color:var(--text-color);max-height:80vh;overflow-y:auto}

    .panel.open{display:block}

    .panel label{font-size:13px;color:var(--text-color)}

    .row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}

    .small{font-size:13px;color:rgba(100,100,120,1)}

    .control-inline{display:flex;gap:8px;align-items:center}

    .color-input{width:24px;height:24px;border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,0.2)}

    .color-input input{width:100%;height:100%;border:none;padding:0;cursor:pointer;background:transparent}

    @media (max-width:520px){.panel{width:92%;right:4%;bottom:80px}} .hidden{display:none} hr{border:none;border-top:1px solid rgba(0,0,0,0.06);margin:12px 0}

    .panel-section-title{margin:12px 0 6px;font-weight:bold;font-size:14px}

  </style>

</head>

  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>

  <script>

    // This will be populated dynamically from README links

    let fileStructure = [];



    // DOM elements

    const navList = document.getElementById('navList');

    const fileContent = document.getElementById('file-content');



    // Extract links from README content

    function extractLinksFromReadme(content) {

      const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;

      const links = [];

      let match;

      

      while ((match = linkRegex.exec(content)) !== null) {

        const name = match[1];

        const path = match[2];

        

        // Only include .md files and exclude external URLs

        if (path.endsWith('.md') && !path.startsWith('http')) {

          // Check if this is a relative path to a directory with a README

          let finalPath = path;

          if (!path.endsWith('.md') && path.endsWith('/')) {

            finalPath = path + 'README.md';

          }

          

          links.push({ name, path: finalPath });

        }

      }

      

      return links;

    }



    // Render navigation

    function renderNavigation() {

      navList.innerHTML = '';

      fileStructure.forEach(file => {

        const li = document.createElement('li');

        const a = document.createElement('a');

        a.href = '#';

        a.textContent = file.name;

        a.dataset.path = file.path;

        a.addEventListener('click', (e) => {

          e.preventDefault();

          // Remove active class from all links

          document.querySelectorAll('#navList a').forEach(link => {

            link.classList.remove('active');

          });

          // Add active class to clicked link

          a.classList.add('active');

          loadFile(file.path);

        });

        li.appendChild(a);

        navList.appendChild(li);

      });

    }



    // Load file function

    async function loadFile(filePath) {

      fileContent.innerHTML = '<div id="loading">Loading file...</div>';

      try {

        const response = await fetch(filePath);

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        

        let content = await response.text();

        

        // Remove YAML frontmatter if present

        if (content.startsWith('---')) {

          const frontmatterEnd = content.indexOf('---', 3);

          if (frontmatterEnd !== -1) {

            content = content.substring(frontmatterEnd + 3).trim();

          }

        }

        

        renderFile(content, filePath);

        

        // If this is the README, extract links and update navigation

        if (filePath === 'README.md') {

          const links = extractLinksFromReadme(content);

          fileStructure = [

            { name: "README", path: "README.md" },

            ...links

          ];

          renderNavigation();

          

          // Set active class to README link

          document.querySelectorAll('#navList a').forEach(link => {

            if (link.dataset.path === 'README.md') {

              link.classList.add('active');

            }

          });

        }

      } catch (error) {

        fileContent.innerHTML = `<div class="error">Error loading file: ${error.message}</div>`;

        console.error('Error loading file:', error);

      }

    }



    // Render file function with markdown parsing

    function renderFile(content, filePath) {

      const markdownToHtml = (text) => {

        return text

          // Headers

          .replace(/^# (.*$)/gim, '<h1>$1</h1>')

          .replace(/^## (.*$)/gim, '<h2>$1</h2>')

          .replace(/^### (.*$)/gim, '<h3>$1</h3>')

          .replace(/^#### (.*$)/gim, '<h4>$1</h4>')

          .replace(/^##### (.*$)/gim, '<h5>$1</h5>')

          .replace(/^###### (.*$)/gim, '<h6>$1</h6>')

          // Bold

          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')

          .replace(/__(.*?)__/g, '<strong>$1</strong>')

          // Italic

          .replace(/\*(.*?)\*/g, '<em>$1</em>')

          .replace(/_(.*?)_/g, '<em>$1</em>')

          // Strikethrough

          .replace(/~~(.*?)~~/g, '<del>$1</del>')

          // Links

          .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>')

          // Images

          .replace(/!\[(.*?)\]\((.*?)\)/g, '<img alt="$1" src="$2" />')

          // Blockquotes

          .replace(/^>\s(.*$)/gim, '<blockquote>$1</blockquote>')

          // Horizontal rule

          .replace(/^\-\-\-\-*$/gim, '<hr />')

          // Unordered lists

          .replace(/^\s*[\-\*\+]\s(.*$)/gim, '<li>$1</li>')

          .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')

          // Ordered lists

          .replace(/^\s*\d+\.\s(.*$)/gim, '<li>$1</li>')

          .replace(/(<li>.*<\/li>)/gs, function(match) {

            return /<li>.*<\/li>/.test(match) ? '<ol>' + match + '</ol>' : match;

          })

          // Paragraphs

          .replace(/^\s*(\n)?(.+)/gim, function(m){

            return /\<(\/)?(h\d|ul|ol|li|blockquote|pre|img|hr)/.test(m) ? m : '<p>'+m+'</p>';

          })

          // Code blocks

          .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="$1">$2</code></pre>')

          // Inline code

          .replace(/`(.*?)`/g, '<code>$1</code>')

          // Tables (basic support)

          .replace(/^\|(.+)\|$/gm, function(match, row) {

            if (match.startsWith('|--')) return ''; // Skip separator rows for now

            const cells = row.split('|').map(cell => `<td>${cell.trim()}</td>`).join('');

            return `<tr>${cells}</tr>`;

          })

          .replace(/(<tr>.*<\/tr>)/gs, function(match) {

            return /<tr>.*<\/tr>/.test(match) ? '<table>' + match + '</table>' : match;

          });

      };

      

      const html = markdownToHtml(content);

      fileContent.innerHTML = html;

      

      // Update browser history

      history.pushState({ path: filePath }, '', `#${filePath}`);

    }



    // Initialize navigation and load README

    function initNavigation() {

      // Start by loading the README

      loadFile('README.md');

    }



    // Three.js code (unchanged from your original)

    const canvas = document.getElementById('bg');

    const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});

    renderer.setPixelRatio(window.devicePixelRatio);

    renderer.setSize(window.innerWidth, window.innerHeight, false);



    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);



    let particleCount = 1200;

    let orbitRadius = 60;

    let geo = null, mat = null, points = null;



    // Camera pan offset (we'll adjust the camera position for panning)

    const cameraPan = {x:0, y:0};



    function createPoints(count){

      if(points){

        scene.remove(points);

        geo.dispose && geo.dispose();

        mat.dispose && mat.dispose();

      }



      particleCount = Math.max(10, Math.floor(count));

      const positions = new Float32Array(particleCount * 3);

      const colors = new Float32Array(particleCount * 3);



      for(let i=0;i<particleCount;i++){

        const i3 = i*3;

        const r = 10 + Math.random()*200;

        const theta = Math.random()*Math.PI*2;

        const phi = Math.acos(2*Math.random()-1);

        positions[i3+0] = r*Math.sin(phi)*Math.cos(theta);

        positions[i3+1] = r*Math.sin(phi)*Math.sin(theta);

        positions[i3+2] = r*Math.cos(phi);



        colors[i3+0] = 0.5 + Math.random()*0.5;

        colors[i3+1] = 0.5 + Math.random()*0.5;

        colors[i3+2] = 0.6 + Math.random()*0.4;

      }



      geo = new THREE.BufferGeometry();

      geo.setAttribute('position', new THREE.BufferAttribute(positions,3));

      geo.setAttribute('color', new THREE.BufferAttribute(colors,3));



      mat = new THREE.PointsMaterial({size:parseFloat(document.getElementById('particleSize').value)||1.8,vertexColors:true,transparent:true,opacity:0.95,depthWrite:false});



      points = new THREE.Points(geo, mat);

      // Keep the particle cloud at the origin

      points.position.set(0, 0, 0);



      scene.add(points);

    }



    createPoints(particleCount);



    const light = new THREE.DirectionalLight(0xffffff,0.4);

    light.position.set(1,1,1);

    scene.add(light);



    window.addEventListener('resize', ()=>{ renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); });



    let lastScrollY = window.scrollY; 

    let targetAngle = 0; 

    let currentAngle = 0;

    const settings = {speed:1.0, orientation:'horizontal', lightMode:false};



    // UI refs

    const speedInput = document.getElementById('speed'); 

    const speedVal = document.getElementById('speedVal'); 

    const orientationInput = document.getElementById('orientation');

    const cogBtn = document.getElementById('cogBtn'); 

    const panel = document.getElementById('panel'); 

    const closePanel = document.getElementById('closePanel');

    const lightModeCheckbox = document.getElementById('lightMode'); 

    const particleSizeInput = document.getElementById('particleSize'); 

    const sizeVal = document.getElementById('sizeVal');

    const colorPreset = document.getElementById('colorPreset'); 

    const colorPicker = document.getElementById('colorPicker'); 

    const customColorRow = document.getElementById('customColorRow');

    const particleCountInput = document.getElementById('particleCount'); 

    const countVal = document.getElementById('countVal');

    const cameraZoomInput = document.getElementById('cameraZoom'); 

    const zoomVal = document.getElementById('zoomVal');

    const cameraPanXInput = document.getElementById('cameraPanX'); 

    const panXVal = document.getElementById('panXVal');

    const cameraPanYInput = document.getElementById('cameraPanY'); 

    const panYVal = document.getElementById('panYVal');

    

    // New content style controls

    const contentBgColorInput = document.getElementById('contentBgColor');

    const textColorInput = document.getElementById('textColor');

    const linkColorInput = document.getElementById('linkColor');

    const linkHoverColorInput = document.getElementById('linkHoverColor');

    const h1ColorInput = document.getElementById('h1Color');

    const h2ColorInput = document.getElementById('h2Color');

    const h3ColorInput = document.getElementById('h3Color');

    const resetContentStylesBtn = document.getElementById('resetContentStyles');



    // Update labels to reflect pan functionality

    document.querySelector('label[for="cameraPanX"]').textContent = "Camera pan X (left / right)";

    document.querySelector('label[for="cameraPanY"]').textContent = "Camera pan Y (up / down)";

    document.querySelector('.row.small div:last-child').textContent = "Pan the camera to view the particle field from different angles.";



    // initial UI values

    speedVal.textContent = settings.speed.toFixed(2); 

    countVal.textContent = particleCount; 

    zoomVal.textContent = orbitRadius; 

    sizeVal.textContent = (1.8).toFixed(1); 

    panXVal.textContent = cameraPan.x; 

    panYVal.textContent = cameraPan.y; 

    customColorRow.classList.add('hidden');



    // handlers

    speedInput.addEventListener('input', (e)=>{ settings.speed = parseFloat(e.target.value); speedVal.textContent = settings.speed.toFixed(2); });

    orientationInput.addEventListener('change', (e)=>{ settings.orientation = e.target.value; });



    particleSizeInput.addEventListener('input', (e)=>{ const v = parseFloat(e.target.value); if(mat) mat.size = v; sizeVal.textContent = v.toFixed(1); });

    lightModeCheckbox.addEventListener('change', (e)=>{ 

      settings.lightMode = e.target.checked; 

      document.documentElement.classList.toggle('light', settings.lightMode); 

      updateColorInputsForTheme();

    });



    colorPreset.addEventListener('change', (e)=>{ const val = e.target.value; if(val === 'custom'){ customColorRow.classList.remove('hidden'); applyCustomColor(colorPicker.value); } else { customColorRow.classList.add('hidden'); applyColorPreset(val); } });

    colorPicker.addEventListener('input', (e)=>{ if(colorPreset.value === 'custom') applyCustomColor(e.target.value); });



    particleCountInput.addEventListener('input', (e)=>{ const val = parseInt(e.target.value); countVal.textContent = val; createPoints(val); if(mat) mat.size = parseFloat(particleSizeInput.value) || mat.size; });



    cameraZoomInput.addEventListener('input', (e)=>{ orbitRadius = parseFloat(e.target.value); zoomVal.textContent = orbitRadius; });



    // Update camera pan handlers

    cameraPanXInput.addEventListener('input', (e)=>{ 

      cameraPan.x = parseFloat(e.target.value); 

      panXVal.textContent = cameraPan.x; 

    });

    

    cameraPanYInput.addEventListener('input', (e)=>{ 

      cameraPan.y = parseFloat(e.target.value); 

      panYVal.textContent = cameraPan.y; 

    });

    

    // New content style handlers

    contentBgColorInput.addEventListener('input', (e) => {

      document.documentElement.style.setProperty('--content-bg', e.target.value);

    });

    

    textColorInput.addEventListener('input', (e) => {

      document.documentElement.style.setProperty('--text-color', e.target.value);

    });

    

    linkColorInput.addEventListener('input', (e) => {

      document.documentElement.style.setProperty('--link-color', e.target.value);

    });

    

    linkHoverColorInput.addEventListener('input', (e) => {

      document.documentElement.style.setProperty('--link-hover-color', e.target.value);

    });

    

    h1ColorInput.addEventListener('input', (e) => {

      document.documentElement.style.setProperty('--h1-color', e.target.value);

    });

    

    h2ColorInput.addEventListener('input', (e) => {

      document.documentElement.style.setProperty('--h2-color', e.target.value);

    });

    

    h3ColorInput.addEventListener('input', (e) => {

      document.documentElement.style.setProperty('--h3-color', e.target.value);

    });

    

    resetContentStylesBtn.addEventListener('click', () => {

      // Reset to default values based on current theme

      if (document.documentElement.classList.contains('light')) {

        document.documentElement.style.setProperty('--content-bg', 'linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4))');

        document.documentElement.style.setProperty('--text-color', '#111');

        document.documentElement.style.setProperty('--link-color', '#0066cc');

        document.documentElement.style.setProperty('--link-hover-color', '#004499');

        document.documentElement.style.setProperty('--h1-color', '#000000');

        document.documentElement.style.setProperty('--h2-color', '#111111');

        document.documentElement.style.setProperty('--h3-color', '#222222');

        

        // Update input values

        contentBgColorInput.value = '#ffffff';

        textColorInput.value = '#111111';

        linkColorInput.value = '#0066cc';

        linkHoverColorInput.value = '#004499';

        h1ColorInput.value = '#000000';

        h2ColorInput.value = '#111111';

        h3ColorInput.value = '#222222';

      } else {

        document.documentElement.style.setProperty('--content-bg', 'linear-gradient(180deg, rgba(15,18,24,0.6), rgba(10,12,16,0.4))');

        document.documentElement.style.setProperty('--text-color', '#e6eef8');

        document.documentElement.style.setProperty('--link-color', '#93d6ff');

        document.documentElement.style.setProperty('--link-hover-color', '#c2e4ff');

        document.documentElement.style.setProperty('--h1-color', '#ffffff');

        document.documentElement.style.setProperty('--h2-color', '#e6eef8');

        document.documentElement.style.setProperty('--h3-color', '#d0d8e2');

        

        // Update input values

        contentBgColorInput.value = '#0f1218';

        textColorInput.value = '#e6eef8';

        linkColorInput.value = '#93d6ff';

        linkHoverColorInput.value = '#c2e4ff';

        h1ColorInput.value = '#ffffff';

        h2ColorInput.value = '#e6eef8';

        h3ColorInput.value = '#d0d8e2';

      }

    });

    

    function updateColorInputsForTheme() {

      if (document.documentElement.classList.contains('light')) {

        contentBgColorInput.value = '#ffffff';

        textColorInput.value = '#111111';

        linkColorInput.value = '#0066cc';

        linkHoverColorInput.value = '#004499';

        h1ColorInput.value = '#000000';

        h2ColorInput.value = '#111111';

        h3ColorInput.value = '#222222';

      } else {

        contentBgColorInput.value = '#0f1218';

        textColorInput.value = '#e6eef8';

        linkColorInput.value = '#93d6ff';

        linkHoverColorInput.value = '#c2e4ff';

        h1ColorInput.value = '#ffffff';

        h2ColorInput.value = '#e6eef8';

        h3ColorInput.value = '#d0d8e2';

      }

    }



    function hexToRgbNorm(hex){ const parsed = hex.replace('#',''); const bigint = parseInt(parsed,16); const r = ((bigint >> 16) & 255)/255; const g = ((bigint >> 8) & 255)/255; const b = (bigint & 255)/255; return [r,g,b]; }



    function applyColorPreset(preset){ if(!geo) return; const arr = geo.attributes.color.array; for(let i=0;i<particleCount;i++){ const i3 = i*3; if(preset === 'warm'){ arr[i3+0] = 0.7 + Math.random()*0.3; arr[i3+1] = 0.35 + Math.random()*0.4; arr[i3+2] = 0.1 + Math.random()*0.25; } else if(preset === 'cool'){ arr[i3+0] = 0.2 + Math.random()*0.35; arr[i3+1] = 0.5 + Math.random()*0.45; arr[i3+2] = 0.7 + Math.random()*0.3; } else if(preset === 'mono'){ const v = 0.55 + Math.random()*0.45; arr[i3+0] = v; arr[i3+1] = v; arr[i3+2] = v; } else { arr[i3+0] = 0.5 + Math.random()*0.5; arr[i3+1] = 0.5 + Math.random()*0.5; arr[i3+2] = 0.6 + Math.random()*0.4; } } geo.attributes.color.needsUpdate = true; }



    function applyCustomColor(hex){ if(!geo) return; const [r,g,b] = hexToRgbNorm(hex); const arr = geo.attributes.color.array; for(let i=0;i<particleCount;i++){ const i3 = i*3; arr[i3+0] = Math.min(1, r * (0.9 + Math.random()*0.2)); arr[i3+1] = Math.min(1, g * (0.9 + Math.random()*0.2)); arr[i3+2] = Math.min(1, b * (0.9 + Math.random()*0.2)); } geo.attributes.color.needsUpdate = true; }



    function onScroll(){ 

      const y = window.scrollY; 

      const dy = y - lastScrollY; 

      lastScrollY = y; 

      targetAngle += dy * settings.speed * 0.0025; 

    }

    window.addEventListener('scroll', onScroll, {passive:true});



    const autoRotSpeed = 0.0006;



    function animate(){ 

      requestAnimationFrame(animate); 

      if(points) points.rotation.y += autoRotSpeed; 

      currentAngle += (targetAngle - currentAngle) * 0.08;



      // Calculate the orbit position

      const orbitX = orbitRadius * Math.sin(currentAngle);

      const orbitZ = orbitRadius * Math.cos(currentAngle);

      

      // Position camera with pan offset

      if (settings.orientation === 'horizontal') {

        // Horizontal orbit (around Y axis)

        camera.position.x = orbitX + cameraPan.x;

        camera.position.y = (Math.sin(currentAngle*0.3) * 8) + cameraPan.y;

        camera.position.z = orbitZ;

      } else {

        // Vertical orbit (around X axis)

        camera.position.x = (Math.sin(currentAngle*0.3) * 8) + cameraPan.x;

        camera.position.y = orbitX + cameraPan.y;

        camera.position.z = orbitZ;

      }



      // Always look at the center of the particle cloud (with pan offset)

      camera.lookAt(cameraPan.x, cameraPan.y, 0);



      renderer.render(scene, camera);

    }

    animate();



    cogBtn.addEventListener('click', ()=>{ panel.classList.toggle('open'); });

    closePanel.addEventListener('click', ()=>{ panel.classList.remove('open'); });



    // Initialize the navigation and markdown rendering

    initNavigation();



    window.__three_demo = {createPoints, applyColorPreset, applyCustomColor, getCameraPan: ()=>({x:cameraPan.x,y:cameraPan.y}), setCameraPan: (x,y)=>{ cameraPan.x = x||0; cameraPan.y = y||0; }};

  </script>

</body>
