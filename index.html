<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wonder Orchards Database</title>
  <style>
    /* Consolidated CSS with simplified variables */
    :root {
      --nav-width: 200px;
      --bg: #071026;
      --text-color: #e6eef8;
      --panel-bg: rgba(15, 23, 36, 0.42);
      --link-color: #93d6ff;
      --link-hover: #c2e4ff;
      --h1-color: #ffffff;
      --h2-color: #e6eef8;
      --h3-color: #d0d8e2;
      --blur-intensity: 8px;
    }
    
    .light {
      --bg: rgba(255,255,255,0.0);
      --text-color: #111;
      --panel-bg: rgba(255,255,255,0.9);
      --link-color: #0066cc;
      --link-hover: #004499;
      --h1-color: #000000;
      --h2-color: #111111;
      --h3-color: #222222;
    }
    
    /* Rest of optimized CSS */
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  
  <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>

  <aside class="nav-container" id="navContainer" aria-label="Primary navigation">
    <div class="nav-header">Documentation</div>
    <ul class="nav-list" id="navList"></ul>
  </aside>

  <main>
    <div class="content">
      <article id="file-content"></article>
    </div>
  </main>

  <button class="cog" id="cogBtn" aria-label="Open settings">
    <!-- Cog SVG -->
  </button>

  <aside class="panel" id="panel" role="dialog" aria-label="Dev settings">
    <!-- Simplified settings panel -->
  </aside>

  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
  <script>
    // Modular JavaScript with better separation of concerns
    import ParticleSystem from './particle-system.js';
    import MarkdownRenderer from './markdown-renderer.js';
    import UIManager from './ui-manager.js';
    
    // Initialize components
    const particleSystem = new ParticleSystem();
    const markdownRenderer = new MarkdownRenderer();
    const uiManager = new UIManager();
    
    // Connect components
    uiManager.onThemeChange(theme => {
      document.documentElement.classList.toggle('light', theme === 'light');
      particleSystem.updateColors(theme);
    });
    
    // Initialization
    markdownRenderer.loadNavigation('README.md');
  </script>
</body>
</html>
