<!doctype html>
<html lang="en" class="dark">
<!-- ... (all the previous HTML content remains the same) ... -->

<script>
  // ... (all the previous JavaScript remains the same until the export function) ...

  // Function to export current settings as default values
  function exportSettingsAsDefault() {
    // Create a clone of the current document
    const clone = document.documentElement.cloneNode(true);
    
    // Remove dynamic content that shouldn't be in the exported file
    const navListClone = clone.querySelector('#navList');
    if (navListClone) navListClone.innerHTML = '';
    
    const fileContentClone = clone.querySelector('#file-content');
    if (fileContentClone) fileContentClone.innerHTML = '';
    
    // Close the panel in the exported version
    const panelClone = clone.querySelector('#panel');
    if (panelClone) panelClone.classList.remove('open');
    
    // Get all input and select elements from the clone
    const inputs = clone.querySelectorAll('input, select');
    
    // Update all input values in the clone to match current settings
    inputs.forEach(input => {
      const liveInput = document.getElementById(input.id);
      if (!liveInput) return;
      
      if (liveInput.type === 'checkbox') {
        input.checked = liveInput.checked;
      } else if (liveInput.type === 'color' || liveInput.type === 'range' || liveInput.tagName === 'SELECT') {
        input.value = liveInput.value;
        
        // For select elements, update the selected option
        if (liveInput.tagName === 'SELECT') {
          const selectedOption = input.options[liveInput.selectedIndex];
          Array.from(input.options).forEach(option => {
            option.removeAttribute('selected');
          });
          if (selectedOption) {
            selectedOption.setAttribute('selected', 'selected');
          }
        }
      } else {
        input.value = liveInput.value;
      }
    });
    
    // Update the theme class
    if (document.documentElement.classList.contains('light')) {
      clone.classList.add('light');
      clone.classList.remove('dark');
    } else {
      clone.classList.add('dark');
      clone.classList.remove('light');
    }
    
    // Get the script content from the clone
    const scriptElement = clone.querySelector('script');
    if (scriptElement) {
      let scriptContent = scriptElement.innerHTML;
      
      // Update the initial values in the script to match current settings
      scriptContent = scriptContent.replace(
        /let particleCount = \d+;/,
        `let particleCount = ${particleCountInput.value};`
      );
      
      scriptContent = scriptContent.replace(
        /let orbitRadius = \d+;/,
        `let orbitRadius = ${cameraZoomInput.value};`
      );
      
      scriptContent = scriptContent.replace(
        /const settings = {speed:[\d.]+, orientation:'[^']+', lightMode:(true|false)};/,
        `const settings = {speed:${speedInput.value}, orientation:'${orientationInput.value}', lightMode:${lightModeCheckbox.checked}};`
      );
      
      // Update the initial UI values section
      scriptContent = scriptContent.replace(
        /speedVal\.textContent = settings\.speed\.toFixed\(2\);[\s\S]*?sizeVal\.textContent = \(1\.8\)\.toFixed\(1\);/,
        `speedVal.textContent = settings.speed.toFixed(2); 
    countVal.textContent = particleCount; 
    zoomVal.textContent = orbitRadius; 
    sizeVal.textContent = (${particleSizeInput.value}).toFixed(1); 
    panXVal.textContent = cameraPan.x; 
    panYVal.textContent = cameraPan.y; `
      );
      
      // Update the initial createPoints call
      scriptContent = scriptContent.replace(
        /createPoints\(particleCount\);[\s\S]*?mat = new THREE\.PointsMaterial/,
        `createPoints(particleCount);
    
    const light = new THREE.DirectionalLight(0xffffff,0.4);
    light.position.set(1,1,1);
    scene.add(light);
    
    window.addEventListener('resize', ()=>{ renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); });
    
    let lastScrollY = window.scrollY; 
    let targetAngle = 0; 
    let currentAngle = 0;
    
    // UI refs
    const speedInput = document.getElementById('speed'); 
    const speedVal = document.getElementById('speedVal'); 
    const orientationInput = document.getElementById('orientation');
    const cogBtn = document.getElementById('cogBtn'); 
    const panel = document.getElementById('panel'); 
    const closePanel = document.getElementById('closePanel');
    const lightModeCheckbox = document.getElementById('lightMode'); 
    const particleSizeInput = document.getElementById('particleSize'); 
    const sizeVal = document.getElementById('sizeVal');
    const colorPreset = document.getElementById('colorPreset'); 
    const colorPicker = document.getElementById('colorPicker'); 
    const customColorRow = document.getElementById('customColorRow');
    const particleCountInput = document.getElementById('particleCount'); 
    const countVal = document.getElementById('countVal');
    const cameraZoomInput = document.getElementById('cameraZoom'); 
    const zoomVal = document.getElementById('zoomVal');
    const cameraPanXInput = document.getElementById('cameraPanX'); 
    const panXVal = document.getElementById('panXVal');
    const cameraPanYInput = document.getElementById('cameraPanY'); 
    const panYVal = document.getElementById('panYVal');
    
    // initial UI values
    speedVal.textContent = settings.speed.toFixed(2); 
    countVal.textContent = particleCount; 
    zoomVal.textContent = orbitRadius; 
    sizeVal.textContent = (${particleSizeInput.value}).toFixed(1); 
    panXVal.textContent = cameraPan.x; 
    panYVal.textContent = cameraPan.y; 
    customColorRow.classList.add('hidden');
    
    // Apply the current color preset
    if (colorPreset.value === 'custom') {
      customColorRow.classList.remove('hidden');
      applyCustomColor(colorPicker.value);
    } else {
      customColorRow.classList.add('hidden');
      applyColorPreset(colorPreset.value);
    }
    
    // Apply light mode if needed
    if (settings.lightMode) {
      document.documentElement.classList.add('light');
    }
    
    mat = new THREE.PointsMaterial`
      );
      
      // Update the script content
      scriptElement.innerHTML = scriptContent;
    }
    
    // Create the HTML string
    const html = `<!doctype html>\n${clone.outerHTML}`;
    
    // Create a Blob and trigger download
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'particle_field_export.html';
    a.click();
    URL.revokeObjectURL(url);
  }

  // ... (the rest of the JavaScript remains the same) ...
</script>
</body>
</html>
