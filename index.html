<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js Particle Field Scroll Orbit</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      font-family: sans-serif;
      color: white;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 50px;
      max-width: 800px;
      margin: 0 auto;
    }

    .section {
      margin: 200px 0;
      font-size: 2rem;
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="content">
    <div class="section">🌌 Welcome to the Particle Field</div>
    <div class="section">🚀 Scroll down and the camera orbits</div>
    <div class="section">✨ Example content with shapes</div>
    <div class="section">⬜⬛🟦🟨🟥 Scroll more…</div>
    <div class="section">🌍 Endless possibilities…</div>
    <div class="section">🎉 You’ve reached the bottom!</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // Setup Scene
    const canvas = document.getElementById("bg");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.z = 50;

    // Particle Field
    const particleCount = 1000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3 + 0] = (Math.random() - 0.5) * 200;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 200;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
    }
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({ color: 0xffffff, size: 1 });
    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // Handle Resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    let scrollY = 0;
    window.addEventListener("scroll", () => {
      scrollY = window.scrollY;
    });

    function animate() {
      requestAnimationFrame(animate);

      // Slow swirl
      points.rotation.y += 0.0005;
      points.rotation.x += 0.0003;

      // Orbit camera based on scroll
      const orbitRadius = 50;
      const angle = scrollY * 0.001; // scroll controls angle
      camera.position.x = Math.cos(angle) * orbitRadius;
      camera.position.z = Math.sin(angle) * orbitRadius;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
