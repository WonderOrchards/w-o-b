<!DOCTYPE html>
<html lang="en" class="dark" style="--nav-panel-bg-color-rgb: 15, 23, 36; --nav-panel-bg-alpha: 0.5; --nav-panel-blur: 3px; --dev-panel-bg-color-rgb: 15, 23, 36; --dev-panel-bg-alpha: 0.5; --dev-panel-blur: 3px; --content-bg-color-rgb: 15, 23, 36; --content-bg-alpha: 0.5; --content-bg-blur: 3px; --link-color: #008cb4; --link-hover-color: #a96800; --h1-color: #a09d3a; --h2-color: #a09d3a; --h3-color: #a09d3a;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wonder Orchards Database</title>
  <style>
    :root {
      --nav-width: 200px; /* reduced width (~15-20% narrower) */
      --bg: #071026;
      --content-bg: linear-gradient(180deg, rgba(15,18,24,0.6), rgba(10,12,16,0.4));
      --text-color: #e6eef8;
      --panel-bg: #0f1724;
      --cog-bg: rgba(14,18,24,0.95);
      --link-color: #93d6ff;
      --link-hover-color: #c2e4ff;
      --h1-color: #ffffff;
      --h2-color: #e6eef8;
      --h3-color: #d0d8e2;
      --code-bg: rgba(0,0,0,0.2);
      --code-color: #ff9d9d;
      --blockquote-border: rgba(93, 173, 255, 0.5);
      --blockquote-bg: rgba(93, 173, 255, 0.08);

      --nav-panel-bg-color-rgb: 15, 23, 36;
      --nav-panel-bg-alpha: 0.42;
      --nav-panel-blur: 8px;

      --dev-panel-bg-color-rgb: 15, 23, 36;
      --dev-panel-bg-alpha: 0.42;
      --dev-panel-blur: 8px;

      --content-bg-color-rgb: 68, 68, 68;
      --content-bg-alpha: 0.08;
      --content-bg-blur: 8px;
    }

    .light {
      --bg: rgba(255,255,255,0.0);
      --content-bg: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));
      --text-color: #111;
      --panel-bg: #ffffff;
      --cog-bg: rgba(255,255,255,0.9);
      --link-color: #0066cc;
      --link-hover-color: #004499;
      --h1-color: #000000;
      --h2-color: #111111;
      --h3-color: #222222;
      --code-bg: rgba(0,0,0,0.06);
      --code-color: #d73038;
      --blockquote-border: rgba(0, 102, 204, 0.4);
      --blockquote-bg: rgba(0, 102, 204, 0.06);

      --nav-panel-bg-color-rgb: 255,255,255;
      --dev-panel-bg-color-rgb: 255,255,255;
      --content-bg-color-rgb: 255,255,255;
    }

    html,body {
      height:100%;
      margin:0;
      font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background:var(--bg);
      color:var(--text-color);
    }

    #bg { position:fixed; inset:0; z-index:0; pointer-events:none; display:block; }

    /* Navigation */
    .nav-container {
      position: fixed;
      left: 20px;
      top: 20px;
      z-index: 2;
      background: rgba(var(--nav-panel-bg-color-rgb), var(--nav-panel-bg-alpha));
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.12);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      width: var(--nav-width);
      backdrop-filter: blur(var(--nav-panel-blur));
      transition: transform 0.28s ease, opacity 0.28s ease;
    }

    .nav-header { font-weight:bold; margin-bottom:12px; color:var(--h2-color); }
    .nav-list { list-style:none; padding:0; margin:0; }
    .nav-list > li { margin-bottom:7px; }
    .nav-group { border-top:1px solid rgba(255,255,255,0.08); padding-top:7px; }
    .nav-group:first-child { border-top:none; padding-top:0; }
    .nav-group summary {
      color:var(--h2-color);
      cursor:pointer;
      font-size:11px;
      font-weight:700;
      letter-spacing:0.09em;
      list-style:none;
      padding:5px 6px;
      text-transform:uppercase;
      user-select:none;
    }
    .nav-group summary::-webkit-details-marker { display:none; }
    .nav-group summary::before { content:'▸'; display:inline-block; margin-right:6px; transition:transform 0.18s ease; }
    .nav-group[open] summary::before { transform:rotate(90deg); }
    .nav-group-list { list-style:none; margin:2px 0 3px; padding:0 0 0 8px; }
    .nav-group-list li { margin-bottom:3px; }
    .nav-list a {
      color:var(--link-color);
      text-decoration:none;
      display:block;
      padding:5px 8px;
      border-radius:6px;
      font-size:13px;
      transition: background 0.2s ease;
    }
    .nav-list a:hover { color:var(--link-hover-color); background: rgba(255,255,255,0.05); }
    .nav-list a.active { background: rgba(93,173,255,0.15); color:var(--link-hover-color); }

    /* Hamburger */
    .hamburger {
      display:none;
      position:fixed;
      top:12px;
      right:12px;
      width:44px;
      height:44px;
      z-index:10;
      background: rgba(var(--nav-panel-bg-color-rgb), var(--nav-panel-bg-alpha));
      border-radius:8px;
      border:none;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:5px;
      cursor:pointer;
      backdrop-filter: blur(var(--nav-panel-blur));
    }
    .hamburger span {
      display:block;
      width:24px;
      height:2px;
      background-color:var(--text-color);
      transition: all 0.3s ease;
    }
    .hamburger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.active span:nth-child(2) { opacity:0; }
    .hamburger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Content */
    .content {
      position:relative;
      z-index:1;
      max-width:900px;
      margin: 40px auto 40px calc(var(--nav-width) + 40px);
      padding:30px;
      background: rgba(var(--content-bg-color-rgb), var(--content-bg-alpha));
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      backdrop-filter: blur(var(--content-bg-blur));
      min-height:400px;
      transition: margin-left 0.25s ease;
    }

    /* Markdown styles */
    #file-content h1 { font-size:clamp(26px,4vw,40px); margin:0 0 12px; color:var(--h1-color); }
    #file-content h2 { color:var(--h2-color); margin-top:1.8em; margin-bottom:0.8em; }
    #file-content h3 { color:var(--h3-color); margin-top:1.5em; margin-bottom:0.7em; }
    #file-content p { line-height:1.6; color:var(--text-color); margin-bottom:1em; }
    #file-content a { color:var(--link-color); text-decoration:none; transition:color 0.2s ease; }
    #file-content a:hover { color:var(--link-hover-color); }
    #file-content ul, #file-content ol { margin-bottom:1em; padding-left:1.8em; }
    #file-content li { margin-bottom:0.4em; line-height:1.5; }
    #file-content code { background:var(--code-bg); color:var(--code-color); padding:0.2em 0.4em; border-radius:4px; font-size:0.9em; }
    #file-content pre { background:var(--code-bg); padding:1em; border-radius:8px; overflow:auto; margin-bottom:1.5em; }
    #file-content blockquote { border-left:4px solid var(--blockquote-border); background:var(--blockquote-bg); padding:1em 1.5em; margin:1.5em 0; border-radius:0 8px 8px 0; }
    #file-content table { width:100%; border-collapse:collapse; margin-bottom:1.5em; }
    #file-content th, #file-content td { padding:0.5em 1em; text-align:left; border:1px solid rgba(255,255,255,0.1); }
    #file-content th { background: rgba(255,255,255,0.05); }

    #loading { text-align:center; padding:2em; color:var(--text-color); opacity:0.9; }

    /* Panel & controls */
    .cog { position:fixed; right:16px; bottom:16px; z-index:3; width:36px; height:36px; border-radius:999px; display:grid; place-items:center; background:var(--cog-bg); box-shadow:0 6px 18px rgba(0,0,0,0.12); cursor:pointer; border:1px solid rgba(0,0,0,0.06); }
    .panel { position:fixed; right:16px; bottom:64px; z-index:4; width:360px; background: rgba(var(--dev-panel-bg-color-rgb), var(--dev-panel-bg-alpha)); border-radius:12px; padding:14px; box-shadow:0 14px 40px rgba(0,0,0,0.12); display:none; color:var(--text-color); max-height:80vh; overflow-y:auto; backdrop-filter: blur(var(--dev-panel-blur)); }
    .panel.open { display:block; }
    .panel label { font-size:13px; color:var(--text-color); }
    .row { display:flex; align-items:center; justify-content:space-between; margin:8px 0; }
    .small { font-size:13px; color:rgba(100,100,120,1); }
    .control-inline { display:flex; gap:8px; align-items:center; }
    .color-input { width:24px; height:24px; border-radius:4px; overflow:hidden; border:1px solid rgba(255,255,255,0.2); }
    .color-input input { width:100%; height:100%; border:none; padding:0; cursor:pointer; background:transparent; }
    .hidden { display:none; }
    hr { border:none; border-top:1px solid rgba(0,0,0,0.06); margin:12px 0; }
    .panel-section-title { margin:12px 0 6px; font-weight:bold; font-size:14px; }

    /* Responsive adjustments */
    @media (max-width:1024px) {
      :root { --nav-width: 180px; }
      .nav-container { width: var(--nav-width); }
      .content { margin-left: calc(var(--nav-width) + 32px); max-width: calc(100% - (var(--nav-width) + 80px)); }
    }

    @media (max-width:768px) {
      .hamburger { display:flex; }
      .nav-container {
        position: fixed;
        left: 8px;
        top: 12px; /* closer to top on mobile */
        width: calc(80% - 16px);
        transform: translateX(-110%);
        opacity: 0;
        visibility: hidden;
        transition: transform 0.28s ease, opacity 0.28s ease, visibility 0.28s;
        overflow-y: auto;
        max-height: calc(100vh - 24px);
      }
      .nav-container.active { transform: translateX(0); opacity:1; visibility:visible; }
      .content { margin: 20px 12px 20px; max-width: calc(100% - 24px); margin-left: 12px; }
      .panel { width:85%; right:4%; bottom:80px; max-height:70vh; }
      .cog { bottom:20px; right:20px; }
    }
  </style>
</head>
<body>
  <canvas id="bg" data-engine="three.js r155" width="3360" height="1890"></canvas>

  <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>

  <aside class="nav-container" id="navContainer" aria-label="Primary navigation">
    <div class="nav-header">Documentation</div>
    <ul class="nav-list" id="navList"></ul>
  </aside>

  <main>
    <div class="content">
      <article id="file-content"></article>
    </div>
  </main>

  <button class="cog" id="cogBtn" aria-label="Open settings" title="Open settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"></path>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 0 1 2.28 17.9l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09c.7 0 1.32-.39 1.51-1a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 0 1 6.1 2.28l.06.06c.45.45 1.07.66 1.67.51.58-.14 1.05-.59 1.2-1.17L9.5 2A2 2 0 0 1 13.5 2l.07.09c.15.58.62 1.03 1.2 1.17.6.15 1.22-.06 1.67-.51l.06-.06A2 2 0 0 1 21.72 6.1l-.06.06c-.45.45-.66 1.07-.51 1.67.14.58.59 1.05 1.17 1.2L22 9.5a2 2 0 0 1 0 4l-.09.07c-.58.15-1.03.62-1.17 1.2-.15.6.06 1.22.51 1.67z"></path>
    </svg>
  </button>

  <aside class="panel" id="panel" role="dialog" aria-label="Dev settings">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <strong>Dev Settings</strong>
      <button id="closePanel" style="border:none;background:transparent;cursor:pointer;font-size:16px;color:var(--text-color)">✕</button>
    </div>

    <div class="row">
      <label for="speed">Orbit rotation speed (per scroll)</label>
      <div class="small" id="speedVal">0.5</div>
    </div>
    <input id="speed" type="range" min="0" max="5" step="0.05" value="1">

    <div class="row" style="margin-top:8px">
      <label for="orientation">Orbit orientation</label>
      <select id="orientation">
        <option value="horizontal" selected>Horizontal (Y axis)</option>
        <option value="vertical">Vertical (X axis)</option>
      </select>
    </div>

    <hr>

    <div class="row">
      <label for="lightMode">Light mode</label>
      <div class="control-inline"><input id="lightMode" type="checkbox"><span class="small">Toggle</span></div>
    </div>

    <div class="row">
      <label for="particleSize">Particle size</label>
      <div class="small" id="sizeVal">0.1</div>
    </div>
    <input id="particleSize" type="range" min="0.1" max="6" step="0.1" value="0.1">

    <div class="row" style="margin-top:8px">
      <label for="colorPreset">Particle colors</label>
      <select id="colorPreset">
        <option value="soft">Soft</option>
        <option value="warm" selected>Warm (default)</option>
        <option value="cool">Cool</option>
        <option value="mono">Monochrome</option>
        <option value="custom">Custom</option>
      </select>
    </div>

    <div class="row hidden" id="customColorRow" style="margin-top:6px">
      <label for="colorPicker">Custom color</label>
      <input id="colorPicker" type="color" value="#93d6ff">
    </div>

    <hr>

    <div class="row">
      <label for="particleCount">Particle count</label>
      <div class="small" id="countVal">6000</div>
    </div>
    <input id="particleCount" type="range" min="200" max="6000" step="50" value="6000">

    <div class="row" style="margin-top:8px">
      <label for="cameraZoom">Camera zoom (distance)</label>
      <div class="small" id="zoomVal">60</div>
    </div>
    <input id="cameraZoom" type="range" min="20" max="220" step="1" value="220">

    <div class="row" style="margin-top:8px">
      <label for="cameraPanX">Camera pan X (left / right)</label>
      <div class="small" id="panXVal">0</div>
    </div>
    <input id="cameraPanX" type="range" min="-200" max="200" step="1" value="0">

    <div class="row" style="margin-top:8px">
      <label for="cameraPanY">Camera pan Y (up / down)</label>
      <div class="small" id="panYVal">0</div>
    </div>
    <input id="cameraPanY" type="range" min="-200" max="200" step="1" value="0">

    <div class="row small" style="margin-top:10px">
      <div>Tip:</div>
      <div>Pan the camera to view the particle field from different angles.</div>
    </div>

    <hr>

    <div class="panel-section-title">Content Styles</div>

    <div class="row">
      <label for="contentBgColor">Content background</label>
      <div class="color-input"><input id="contentBgColor" type="color" value="#0f1218"></div>
    </div>

    <div class="row">
      <label for="textColor">Text color</label>
      <div class="color-input"><input id="textColor" type="color" value="#e6eef8"></div>
    </div>

    <div class="row">
      <label for="linkColor">Link color</label>
      <div class="color-input"><input id="linkColor" type="color" value="#93d6ff"></div>
    </div>

    <div class="row">
      <label for="linkHoverColor">Link hover color</label>
      <div class="color-input"><input id="linkHoverColor" type="color" value="#c2e4ff"></div>
    </div>

    <div class="row">
      <label for="h1Color">H1 heading color</label>
      <div class="color-input"><input id="h1Color" type="color" value="#ffffff"></div>
    </div>

    <div class="row">
      <label for="h2Color">H2 heading color</label>
      <div class="color-input"><input id="h2Color" type="color" value="#e6eef8"></div>
    </div>

    <div class="row">
      <label for="h3Color">H3 heading color</label>
      <div class="color-input"><input id="h3Color" type="color" value="#d0d8e2"></div>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="resetContentStyles" style="padding:6px 12px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--text-color);cursor:pointer">Reset Content Styles</button>
    </div>

    <hr>

    <div class="panel-section-title">Background Customization</div>

    <div class="row">
      <label>Navigation Panel</label>
    </div>

    <div class="row">
      <label for="navPanelColor">Color</label>
      <div class="color-input"><input id="navPanelColor" type="color" value="#0f1724"></div>
    </div>

    <div class="row">
      <label for="navPanelAlpha">Transparency</label>
      <div class="small" id="navPanelAlphaVal">50%</div>
    </div>
    <input id="navPanelAlpha" type="range" min="0" max="100" step="1" value="100">

    <div class="row">
      <label for="navPanelBlur">Blur</label>
      <div class="small" id="navPanelBlurVal">3px</div>
    </div>
    <input id="navPanelBlur" type="range" min="0" max="20" step="1" value="0">

    <div class="row">
      <label>Dev Settings Panel</label>
    </div>

    <div class="row">
      <label for="devPanelColor">Color</label>
      <div class="color-input"><input id="devPanelColor" type="color" value="#0f1724"></div>
    </div>

    <div class="row">
      <label for="devPanelAlpha">Transparency</label>
      <div class="small" id="devPanelAlphaVal">50%</div>
    </div>
    <input id="devPanelAlpha" type="range" min="0" max="100" step="1" value="100">

    <div class="row">
      <label for="devPanelBlur">Blur</label>
      <div class="small" id="devPanelBlurVal">3px</div>
    </div>
    <input id="devPanelBlur" type="range" min="0" max="20" step="1" value="0">

    <div class="row">
      <label>Content Background</label>
    </div>

    <div class="row">
      <label for="contentBgSolidColor">Color</label>
      <div class="color-input"><input id="contentBgSolidColor" type="color" value="#0f1218"></div>
    </div>

    <div class="row">
      <label for="contentBgAlpha">Transparency</label>
      <div class="small" id="contentBgAlphaVal">50%</div>
    </div>
    <input id="contentBgAlpha" type="range" min="0" max="100" step="1" value="100">

    <div class="row">
      <label for="contentBgBlur">Blur</label>
      <div class="small" id="contentBgBlurVal">3px</div>
    </div>
    <input id="contentBgBlur" type="range" min="0" max="20" step="1" value="6">

    <div class="row" style="margin-top:10px">
      <button id="resetBackgroundStyles" style="padding:6px 12px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--text-color);cursor:pointer">Reset Background Styles</button>
    </div>

    <hr>

    <div class="panel-section-title">Export Settings</div>

    <div class="row" style="margin-top:10px">
      <button id="exportSettings" style="padding:6px 12px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--text-color);cursor:pointer">Export as Default Settings</button>
    </div>
  </aside>

  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
  <script>
    // ---------- DOM refs ----------
    const navList = document.getElementById('navList');
    const fileContent = document.getElementById('file-content');
    const hamburger = document.getElementById('hamburger');
    const navContainer = document.getElementById('navContainer');

    // toggles
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navContainer.classList.toggle('active');
    });

    // ---------- Markdown navigation/parser ----------
    let fileStructure = [];

    // Lead with the documents that help a person encounter Wonder Orchards:
    // what is happening, why it exists, what is being noticed, and how to act.
    const humanEncounterOrder = [
      'data/now.md',
      'data/vision.md',
      'data/dna.md',
      'data/observations.md',
      'data/nursery/experiments/propagation-experiments-overview.md',
      'data/nursery/experiments/propagation-tests/meyer-lemon-cuttings.md',
      'data/nursery/experiments/propagation-tests/air-layering-experiments.md',
      'data/nursery/experiments/propagation-tests/accidental-oak-cutting.md',
      'data/decisions.md',
      'data/workflows.md',
      'tasks/in-progress.md',
      'tasks/backlog.md',
      'tasks/completed.md',
      'data/database-growth.md',
      'README.md',
      'data/accounts.md'
    ];

    const navigationGroups = [
      { id: 'start', label: 'Start Here', open: true },
      { id: 'orchard', label: 'Living Orchard', open: true },
      { id: 'work', label: 'Work & Decisions', open: true },
      { id: 'operations', label: 'Operations & Growth', open: false },
      { id: 'stewardship', label: 'Stewardship', open: false },
      { id: 'history', label: 'History', open: false },
      { id: 'development', label: 'Development', open: false },
      { id: 'other', label: 'Other', open: false }
    ];

    function navigationGroup(path) {
      if (['data/now.md', 'data/vision.md', 'data/dna.md', 'README.md'].includes(path)) return 'start';
      if (path === 'data/observations.md' || path.startsWith('data/nursery/')) return 'orchard';
      if (path === 'data/decisions.md' || path === 'data/workflows.md' || path.startsWith('tasks/')) return 'work';
      if (['data/accounts.md', 'data/database-growth.md'].includes(path)) return 'operations';
      if (path.startsWith('inbox/') || path === 'data/inbox-digestion-protocol.md' || path === 'dev/steward-cultivation-procedure.md') return 'stewardship';
      if (path.startsWith('versions/')) return 'history';
      if (path.startsWith('dev/') || path.startsWith('scripts/') || path.startsWith('templates/')) return 'development';
      return 'other';
    }

    function formatNavigationLabel(value) {
      return value
        .replace(/\.md$/i, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function navigationRank(path) {
      const exactRank = humanEncounterOrder.indexOf(path);
      if (exactRank !== -1) return exactRank;

      const fallbackStart = humanEncounterOrder.length;
      if (path.startsWith('data/nursery/')) return fallbackStart + 10;
      if (path.startsWith('data/')) return fallbackStart + 20;
      if (path.startsWith('tasks/')) return fallbackStart + 30;
      if (path.startsWith('inbox/')) return fallbackStart + 40;
      if (path.startsWith('dev/')) return fallbackStart + 50;
      if (path.startsWith('scripts/')) return fallbackStart + 60;
      if (path.startsWith('templates/')) return fallbackStart + 70;
      if (path.startsWith('versions/')) return fallbackStart + 80;
      return fallbackStart + 90;
    }

    function compareForHumanEncounter(a, b) {
      const rankDifference = navigationRank(a.path) - navigationRank(b.path);
      if (rankDifference !== 0) return rankDifference;
      return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
    }

    function extractLinksFromReadme(content) {
      const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
      const links = [];
      let match;
      while ((match = linkRegex.exec(content)) !== null) {
        const name = match[1].trim();
        let path = match[2].trim();
        if (path.includes('://') || path.startsWith('mailto:')) continue;
        if (path.endsWith('/')) path = path + 'README.md';
        if (path.endsWith('.md') && !path.startsWith('http')) links.push({ name, path });
      }
      return links;
    }

    async function loadFile(filePath) {
      fileContent.innerHTML = '<div id="loading">Loading file...</div>';
      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let content = await res.text();
        if (content.startsWith('---')) {
          const fmEnd = content.indexOf('\n---', 3);
          if (fmEnd !== -1) content = content.substring(fmEnd + 4).trim();
        }
        renderFile(content, filePath);

      } catch (err) {
        fileContent.innerHTML = `<div class="error">Error loading file: ${err.message}</div>`;
        console.error(err);
      }
    }

    function renderFile(content, filePath) {
      // Temporarily extract code blocks
      const codeBlocks = [];
      content = content.replace(/```(\w+)?\n([\s\S]*?)```/g, (m, lang, code) => {
        const token = `{{CODE_BLOCK_${codeBlocks.length}}}`;
        codeBlocks.push({ lang: lang || '', code });
        return token;
      });

      let html = content
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
        .replace(/^##### (.*$)/gim, '<h5>$1</h5>')
        .replace(/^###### (.*$)/gim, '<h6>$1</h6>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/__(.*?)__/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/_(.*?)_/g, '<em>$1</em>')
        .replace(/~~(.*?)~~/g, '<del>$1</del>')
        .replace(/!\[(.*?)\]\((.*?)\)/g, '<img alt="$1" src="$2" />')
        .replace(/\[(.*?)\]\((.*?)\)/g, function(m, txt, url) {
          if (url.includes('://') || url.startsWith('#') || url.startsWith('mailto:')) {
            return '<a href="' + url + '">' + txt + '</a>';
          } else {
            return '<a href="#" class="internal-link" data-path="' + url + '">' + txt + '</a>';
          }
        })
        .replace(/^>\s(.*$)/gim, '<blockquote>$1</blockquote>')
        .replace(/^\-\-\-\-*$/gim, '<hr />')
        .replace(/^\s*[\-\*\+]\s(.*$)/gim, '<li>$1</li>')
        .replace(/(<li>[\s\S]*?<\/li>)/gim, '<ul>$1</ul>')
        .replace(/^\s*\d+\.\s(.*$)/gim, '<li>$1</li>')
        .replace(/(<li>[\s\S]*?<\/li>)/gim, function(m) { return '<ol>' + m + '</ol>'; })
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/^\s*(\n)?(.+)/gim, function(m) {
          return /\<(\/)?(h\d|ul|ol|li|blockquote|pre|img|hr)/.test(m) ? m : '<p>' + m + '</p>';
        });

      // restore code blocks
      codeBlocks.forEach((b, i) => {
        const token = `{{CODE_BLOCK_${i}}}`;
        const escaped = '<pre><code' + (b.lang ? ' class="' + b.lang + '"' : '') + '>' +
                        b.code.replace(/</g, '&lt;') +
                        '</code></pre>';
        html = html.replace(token, escaped);
      });

      fileContent.innerHTML = html;

      // attach internal link behavior
      document.querySelectorAll('.internal-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const path = link.getAttribute('data-path');
          loadFile(path);
          document.querySelectorAll('#navList a').forEach(navLink => navLink.classList.toggle('active', navLink.dataset.path === path));
          if (window.innerWidth <= 768) {
            hamburger.classList.remove('active');
            navContainer.classList.remove('active');
          }
          // programmatic scroll - keep auto behavior but sync scroll baseline afterward
          try { fileContent.scrollIntoView({ behavior: 'auto', block: 'start' }); } catch (err) {}
          // sync baseline after small delay
          setTimeout(() => { lastScrollY = getScrollPos(); }, 60);
        });
      });

      try { history.pushState({ path: filePath }, '', `#${filePath}`); } catch (e) { location.hash = filePath; }

      // Sync lastScrollY after programmatic navigation to avoid a big first-scroll delta.
      setTimeout(() => { lastScrollY = getScrollPos(); }, 60);
    }

    // ---------- Three.js ----------
    const canvas = document.getElementById('bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    const clampedPixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(clampedPixelRatio);

    function createPoints(count) {
      if (points) {
        scene.remove(points);
        try { geo.dispose && geo.dispose(); } catch(e) {}
        try { mat.dispose && mat.dispose(); } catch(e) {}
      }
      particleCount = Math.max(10, Math.floor(count));
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const r = 10 + Math.random() * 200;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i3 + 0] = r * Math.sin(phi) * Math.cos(theta);
        positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i3 + 2] = r * Math.cos(phi);
        colors[i3 + 0] = 0.5 + Math.random() * 0.5;
        colors[i3 + 1] = 0.5 + Math.random() * 0.5;
        colors[i3 + 2] = 0.6 + Math.random() * 0.4;
      }
      geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      mat = new THREE.PointsMaterial({
        size: parseFloat(document.getElementById('particleSize').value) || 0.1,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
      });
      points = new THREE.Points(geo, mat);
      points.position.set(0, 0, 0);
      scene.add(points);
    }

      if (useVisualViewport) {
        // visualViewport may provide pageTop / offsetTop in various browsers — fallback to scrollY
        return (window.visualViewport.pageTop ?? window.visualViewport.offsetTop ?? window.scrollY ?? 0);

    const SMOOTH_FACTOR = 0.88; // smoothing factor to reduce single-event jumps

    function onScrollImproved() {
      const pos = getScrollPos();
      let dy = pos - lastScrollY;

      // Clamp huge jumps caused by address bar/hardware UI changes
      if (Math.abs(dy) > MAX_DY) dy = Math.sign(dy) * MAX_DY;

      lastScrollY = pos;

      // Apply slight smoothing
      const smoothed = dy * SMOOTH_FACTOR;

      // Invert direction: negative -> inverted scroll-driven rotation
      // (this is where you flip the rotation direction)
      targetAngle += (smoothed) * settings.speed * 0.0025;
    }

        setTimeout(() => { lastScrollY = getScrollPos(); }, 40);

        contentBgColorInput.value = '#0f1218';
        textColorInput.value = '#e6eef8';
        linkColorInput.value = '#93d6ff';
        linkHoverColorInput.value = '#c2e4ff';
        h1ColorInput.value = '#ffffff';
        h2ColorInput.value = '#e6eef8';
        h3ColorInput.value = '#d0d8e2';
      }
    });

    navPanelColorInput.addEventListener('input', updateBackgroundStyles);
    navPanelAlphaInput.addEventListener('input', (e) => { navPanelAlphaVal.textContent = `${e.target.value}%`; updateBackgroundStyles(); });
    navPanelBlurInput.addEventListener('input', (e) => { navPanelBlurVal.textContent = `${e.target.value}px`; updateBackgroundStyles(); });

    devPanelColorInput.addEventListener('input', updateBackgroundStyles);
    devPanelAlphaInput.addEventListener('input', (e) => { devPanelAlphaVal.textContent = `${e.target.value}%`; updateBackgroundStyles(); });
    devPanelBlurInput.addEventListener('input', (e) => { devPanelBlurVal.textContent = `${e.target.value}px`; updateBackgroundStyles(); });

    contentBgSolidColorInput.addEventListener('input', updateBackgroundStyles);
    contentBgAlphaInput.addEventListener('input', (e) => { contentBgAlphaVal.textContent = `${e.target.value}%`; updateBackgroundStyles(); });
    contentBgBlurInput.addEventListener('input', (e) => { contentBgBlurVal.textContent = `${e.target.value}px`; updateBackgroundStyles(); });

    resetBackgroundStylesBtn.addEventListener('click', resetBackgroundStyles);
    exportSettingsBtn.addEventListener('click', exportSettingsAsDefault);

    function updateColorInputsForTheme() {
      if (document.documentElement.classList.contains('light')) {
        contentBgColorInput.value = '#ffffff';
        textColorInput.value = '#111111';
        linkColorInput.value = '#0066cc';
        linkHoverColorInput.value = '#004499';
        h1ColorInput.value = '#a09d3a';
        h2ColorInput.value = '#a09d3a';
        h3ColorInput.value = '#a09d3a';
      } else {
        contentBgColorInput.value = '#0f1218';
        textColorInput.value = '#e6eef8';
        linkColorInput.value = '#93d6ff';
        linkHoverColorInput.value = '#c2e4ff';
        h1ColorInput.value = '#ffffff';
        h2ColorInput.value = '#e6eef8';
        h3ColorInput.value = '#d0d8e2';
      }
    }

    function hexToRgbNorm(hex) {
      const parsed = hex.replace('#','');
      const bigint = parseInt(parsed,16);
      const r = ((bigint >> 16) & 255)/255;
      const g = ((bigint >> 8) & 255)/255;
      const b = (bigint & 255)/255;
      return [r,g,b];
    }

    function applyColorPreset(preset) {
      if (!geo) return;
      const arr = geo.attributes.color.array;
      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        if (preset === 'warm') {
          arr[i3+0] = 0.7 + Math.random()*0.3;
          arr[i3+1] = 0.35 + Math.random()*0.4;
          arr[i3+2] = 0.1 + Math.random()*0.25;
        } else if (preset === 'cool') {
          arr[i3+0] = 0.2 + Math.random()*0.35;
          arr[i3+1] = 0.5 + Math.random()*0.45;
          arr[i3+2] = 0.7 + Math.random()*0.3;
        } else if (preset === 'mono') {
          const v = 0.55 + Math.random()*0.45;
          arr[i3+0] = v; arr[i3+1] = v; arr[i3+2] = v;
        } else {
          arr[i3+0] = 0.5 + Math.random()*0.5;
          arr[i3+1] = 0.5 + Math.random()*0.5;
          arr[i3+2] = 0.6 + Math.random()*0.4;
        }
      }
      geo.attributes.color.needsUpdate = true;
    }

    function applyCustomColor(hex) {
      if (!geo) return;
      const [r,g,b] = hexToRgbNorm(hex);
      const arr = geo.attributes.color.array;
      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        arr[i3+0] = Math.min(1, r * (0.9 + Math.random()*0.2));
        arr[i3+1] = Math.min(1, g * (0.9 + Math.random()*0.2));
        arr[i3+2] = Math.min(1, b * (0.9 + Math.random()*0.2));
      }
      geo.attributes.color.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      if (points) points.rotation.y += autoRotSpeed;
      currentAngle += (targetAngle - currentAngle) * 0.08;
      const orbitX = orbitRadius * Math.sin(currentAngle);
      const orbitZ = orbitRadius * Math.cos(currentAngle);

      if (settings.orientation === 'horizontal') {
        camera.position.x = orbitX + cameraPan.x;
        camera.position.y = (Math.sin(currentAngle * 0.3) * 8) + cameraPan.y;
        camera.position.z = orbitZ;
      } else {
        camera.position.x = (Math.sin(currentAngle * 0.3) * 8) + cameraPan.x;
        camera.position.y = orbitX + cameraPan.y;
        camera.position.z = orbitZ;
      }

      camera.lookAt(cameraPan.x, cameraPan.y, 0);
      renderer.render(scene, camera);
    }
    animate();

    cogBtn.addEventListener('click', () => panel.classList.toggle('open'));
    closePanel.addEventListener('click', () => panel.classList.remove('open'));

    // init
    initNavigation();
    resetBackgroundStyles();

    // expose for debugging
    window.__three_demo = {
      createPoints, applyColorPreset, applyCustomColor,
      getCameraPan: () => ({ x: cameraPan.x, y: cameraPan.y }),
      setCameraPan: (x,y) => { cameraPan.x = x || 0; cameraPan.y = y || 0; }
    };
  </script>
</body>
</html>
