<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js Particle Field + Dynamic Navigation</title>

  <!-- CSS Files (relative to index.html in repo root) -->
  <link rel="stylesheet" href="frontend/css/main.css">
  <link rel="stylesheet" href="frontend/css/components/navigation.css">
  <link rel="stylesheet" href="frontend/css/components/content.css">
  <link rel="stylesheet" href="frontend/css/components/panel.css">
  <link rel="stylesheet" href="frontend/css/components/responsive.css">

  <!-- small helpful meta -->
  <meta name="referrer" content="no-referrer" />
</head>

<body>
  <!-- canvas for Three.js background -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- Navigation sidebar -->
  <aside class="nav-container" aria-label="Documentation navigation">
    <div class="nav-header">Documentation</div>
    <ul class="nav-list" id="navList"></ul>
  </aside>

  <main>
    <div class="content">
      <article id="file-content" aria-live="polite"></article>
    </div>
  </main>

  <!-- small cog button opens dev/settings panel -->
  <button class="cog" id="cogBtn" aria-label="Open settings" title="Open settings">
    <!-- svg icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true">
      <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"></path>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 0 1 2.28 17.9l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09c.7 0 1.32-.39 1.51-1a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 0 1 6.1 2.28l.06.06c.45.45 1.07.66 1.67.51.58-.14 1.05-.59 1.2-1.17L9.5 2A2 2 0 0 1 13.5 2l.07.09c.15.58.62 1.03 1.2 1.17.6.15 1.22-.06 1.67-.51l.06-.06A2 2 0 0 1 21.72 6.1l-.06.06c-.45.45-.66 1.07-.51 1.67.14.58.59 1.05 1.17 1.2L22 9.5a2 2 0 0 1 0 4l-.09.07c-.58.15-1.03.62-1.17 1.2-.15.6.06 1.22.51 1.67z"/>
    </svg>
  </button>

  <!-- Dev/settings panel (content injected dynamically) -->
  <aside class="panel" id="panel" role="dialog" aria-label="Dev settings" hidden></aside>

  <!-- Three.js (global library) -->
  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>

  <!-- Your app entrypoint (module). Keep this single entrypoint and import other modules inside it. -->
  <script type="module" src="frontend/js/main.js"></script>

  <!-- Fallback for users without JS -->
  <noscript>
    <div style="padding:16px;background:#111;color:#fff;">
      JavaScript is required for this page to function. Please enable JavaScript in your browser.
    </div>
  </noscript>
</body>
</html>
